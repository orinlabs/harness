# Example repo-managed agent bundle.
#
# Real bundles live in the (private) agents repo (one <name>.yaml +
# <name>/ folder per production agent); this copy exists so (a) the schema
# has a living, validated example and (b) CI exercises
# `harness validate-agents` against a realistic layout, including a
# shared/ fragment.
#
# Validate:   uv run harness validate-agents --agents-dir examples/bundles
# Render:     uv run harness render-agent bidlevel --agents-dir examples/bundles
# Schema:     harness-spec.json (generated from src/harness/spec.py)

spec_version: 1
name: bidlevel
display_name: Bid Leveling Assistant
model: anthropic/claude-sonnet-4-5
reasoning_effort: high
max_tokens: 16384
max_sleep_hours: 24
timezone: America/New_York

system_prompt_file: bidlevel/system.md
prompt_fragments:
  - shared/communication-style.md

files:
  # `document` files are delivered as agent documents (kind=skill),
  # upserted by title on sync; the agent reads them via get_document.
  - path: bidlevel/sops/bid-leveling-checklist.md
    target: document
    title: "SOP: bid leveling checklist"
  # `sandbox` files are shipped into the agent's sandbox, applied by
  # the control plane before the agent wakes.
  - path: bidlevel/sandbox/leveling_sheet.py
    target: sandbox
    dest: tools/leveling_sheet.py

# Adapter presence only -- credentials always stay in Bedrock.
adapters:
  - Documents
  - Computer

# Tool names the prompt assumes exist; Bedrock warns when unsatisfied.
expected_tools:
  - get_document
  - computer_exec

feature_flags:
  auto_associative_memory: "on"

memory:
  system: tiered_sqlite
  summarizer_model: openai/gpt-5-nano
