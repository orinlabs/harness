# Example repo-managed agent bundle.
#
# Real bundles live in the private orinlabs/agents repo (one <name>.yaml +
# <name>/ folder per production agent); this copy exists so (a) the schema
# has a living, validated example and (b) CI exercises
# `harness validate-agents` against a realistic layout, including a
# shared/ fragment.
#
# Validate:   uv run harness validate-agents --agents-dir examples/bundles
# Render:     uv run harness render-agent example-po --agents-dir examples/bundles
# Schema:     harness-spec.json (generated from src/harness/spec.py)

spec_version: 1
name: example-po
display_name: Example PO Agent
model: anthropic/claude-sonnet-4-5
reasoning_effort: high
max_tokens: 16384
max_sleep_hours: 24
timezone: America/New_York

system_prompt_file: example-po/system.md
prompt_fragments:
  - shared/communication-style.md

files:
  # `document` files become Bedrock Document rows (kind=skill), upserted
  # by title on sync; the agent reads them via get_document.
  - path: example-po/sops/build-po.md
    target: document
    title: "SOP: build a purchase order"
  # `sandbox` files are shipped into the agent's Computer (Blaxel)
  # sandbox by Bedrock's pre-wake apply step.
  - path: example-po/sandbox/po_flow_write.py
    target: sandbox
    dest: tools/po_flow_write.py

# Adapter presence only -- credentials always stay in Bedrock.
adapters:
  - Documents
  - Computer

# Tool names the prompt assumes exist; Bedrock warns when unsatisfied.
expected_tools:
  - get_document
  - computer_exec

feature_flags:
  auto_associative_memory: "on"

memory:
  system: tiered_sqlite
  summarizer_model: openai/gpt-5-nano
